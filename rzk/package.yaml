name: rzk
version: 0.8.0
github: "rzk-lang/rzk"
license: BSD3
author: "Nikolai Kudasov"
maintainer: "nickolay.kudasov@gmail.com"
copyright: "2023-2025 Nikolai Kudasov"

extra-doc-files:
  - README.md
  - ChangeLog.md

extra-source-files:
  - grammar/Syntax.cf
  - test/typecheck/SCHEMA.md
  - test/typecheck/cases/**/*.rzk
  - test/typecheck/cases/**/*.expect.yaml
  - test/typecheck/cases/**/*.yaml
  - test/typecheck/cases/**/*.md

synopsis: An experimental proof assistant for synthetic ∞-categories
category: Dependent Types # same as Agda

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/rzk-lang/rzk#readme>

flags:
  lsp:
    description: >-
      Build with LSP support (only available with GHC, not GHCJS).
    manual: true
    default: true

when:
  - condition: flag(lsp) && !impl(ghcjs)
    cpp-options: -DLSP_ENABLED

custom-setup:
  dependencies:
    base: ">= 4.18.0.0 && < 5.0"
    Cabal: ">= 3.10.1.0 && < 4.0"
    process: ">= 1.6.17.0"

build-tools:
  alex:alex: ">= 3.2.4"
  happy:happy: ">= 1.19.9"
  BNFC:bnfc: ">= 2.9.6.2"

dependencies:
  array: ">= 0.5.5.0"
  base: ">= 4.18.0.0 && < 5"
  bifunctors: ">= 5.6.1"
  bytestring: ">= 0.11.5.0"
  directory: ">= 1.3.8.0"
  Glob: ">= 0.10.1"
  mtl: ">= 2.3.1"
  template-haskell: ">= 2.20.0.0"
  text: ">= 2.0.2"
  yaml: ">= 0.11.11.0"

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Werror=missing-fields
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  # - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  - -optP-Wno-nonportable-include-path

default-extensions:
  - DeriveDataTypeable

library:
  source-dirs: src
  generated-other-modules:
    - Paths_rzk
  when:
    - condition: false
      other-modules:
        - Language.Rzk.Syntax.Test
        - Language.Rzk.Syntax.ErrM
        - Language.Rzk.Syntax.Skel
    - condition: flag(lsp) && !impl(ghcjs)
      exposed-modules:
        - Language.Rzk.VSCode.Config
        - Language.Rzk.VSCode.Env
        - Language.Rzk.VSCode.Handlers
        - Language.Rzk.VSCode.Logging
        - Language.Rzk.VSCode.Lsp
        - Language.Rzk.VSCode.Tokenize
      dependencies:
        aeson: ">= 2.0.0.0"
        co-log-core: ">= 0.3.2.0"
        data-default-class: ">= 0.1.2.0"
        filepath: ">= 1.4.100.0"
        lens: ">= 5.0.1"
        lsp: ">= 2.4.0.0"
        lsp-types: ">= 2.1.1.0"
        mtl: ">= 2.3.1"
        stm: ">= 2.5.1.0"

executables:
  rzk:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - rzk
    when:
      - condition: "!impl(ghcjs)"
        dependencies:
          with-utf8: ">= 1.0.3.0"
          optparse-generic: ">= 1.4.7"

tests:
  rzk-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    build-tools:
      hspec-discover:hspec-discover: ">= 0"
    dependencies:
      - aeson
      - filepath
      - rzk
      - hspec
      - hspec-discover
      - yaml

  doctests:
    source-dirs: test
    main: doctests.hs
    other-modules: []
    dependencies:
      base: ">= 4.18.0.0 && < 5.0"
      doctest-parallel: ">= 0.3"
      rzk:
      Glob: ">= 0.10.1"
      QuickCheck: ">= 2.14.3"
      template-haskell: ">= 2.20.0.0"
