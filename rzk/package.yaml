name: rzk
version: 0.9.2
github: "rzk-lang/rzk"
license: BSD3
author: "Nikolai Kudasov"
maintainer: "nickolay.kudasov@gmail.com"
copyright: "2023-2025 Nikolai Kudasov"

extra-doc-files:
  - README.md
  - ChangeLog.md

extra-source-files:
  - grammar/Syntax.cf
  - test/typecheck/SCHEMA.md
  - test/typecheck/cases/**/*.rzk
  - test/typecheck/cases/**/*.expect.yaml
  - test/typecheck/cases/**/*.yaml
  - test/typecheck/cases/**/*.md

synopsis: An experimental proof assistant for synthetic ∞-categories
category: Dependent Types # same as Agda

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/rzk-lang/rzk#readme>

flags:
  lsp:
    description: >-
      Build with LSP support (only available with GHC, not GHCJS).
    manual: true
    default: true

when:
  - condition: flag(lsp) && !impl(ghcjs)
    cpp-options: -DLSP_ENABLED

# build-type is Simple (hpack's default): the parser and lexer are generated
# from grammar/Syntax.cf by BNFC + alex + happy *out of band* (run `make -C rzk
# regen-parser`) and the results are committed under src/Language/Rzk/Syntax.
# We deliberately avoid build-type: Custom — a Custom Setup.hs cannot run under
# the GHC WebAssembly backend (cabal compiles it to a .wasm module and cannot
# execute it), and it forced every consumer (Hackage installs included) to
# build BNFC/alex/happy. The `Parser up-to-date` CI workflow regenerates from
# the grammar and fails if the committed files drift.

# Lower bounds here are loose so the package builds under the GHCJS path
# (miso's pinned Nixpkgs ships an older Haskell package set). The
# GHC-9.6.3-coherent floors live in cabal.project's `constraints:` block,
# which is read by cabal but not by cabal2nix → Nix.
dependencies:
  # Upper bounds are at the next super-major, so a new GHC's boot libraries
  # (array, bytestring, directory, mtl, template-haskell, text) and the
  # Nix/GHCJS package set both stay in range without a Hackage revision on
  # every minor dependency bump.
  # Loose lower bound so the GHCJS path (miso's pinned package set ships
  # aeson 1.x) resolves; the GHC-era floor (aeson >= 2) lives in
  # cabal.project, which cabal2nix does not read.
  aeson: ">= 1.4 && < 3"
  array: ">= 0.5.3.0 && < 1"
  base: ">= 4.7 && < 5"
  bifunctors: ">= 5.5.3 && < 6"
  bytestring: ">= 0.10.8.2 && < 1"
  containers: ">= 0.6 && < 1"
  directory: ">= 1.2.7.0 && < 2"
  Glob: ">= 0.9.3 && < 1"
  mtl: ">= 2.2.2 && < 3"
  template-haskell: ">= 2.14.0.0 && < 3"
  text: ">= 1.2.3.1 && < 3"
  yaml: ">= 0.11.0.0 && < 1"

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Werror=missing-fields
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  # - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  - -optP-Wno-nonportable-include-path

default-extensions:
  - DeriveDataTypeable

library:
  source-dirs: src
  generated-other-modules:
    - Paths_rzk
  when:
    - condition: false
      other-modules:
        - Language.Rzk.Syntax.Test
        - Language.Rzk.Syntax.ErrM
        - Language.Rzk.Syntax.Skel
    - condition: flag(lsp) && !impl(ghcjs)
      exposed-modules:
        - Language.Rzk.VSCode.Config
        - Language.Rzk.VSCode.Env
        - Language.Rzk.VSCode.Handlers
        - Language.Rzk.VSCode.Logging
        - Language.Rzk.VSCode.Lsp
        - Language.Rzk.VSCode.Tokenize
        - Language.Rzk.VSCode.ReferenceIndex
      dependencies:
        aeson: ">= 2.0.0.0 && < 3"
        async: ">= 2.2 && < 3"
        co-log-core: ">= 0.3.2.0 && < 1"
        data-default-class: ">= 0.1.2.0 && < 1"
        filepath: ">= 1.4.100.0 && < 2"
        lens: ">= 5.0.1 && < 6"
        lsp: ">= 2.4.0.0 && < 3"
        lsp-types: ">= 2.1.1.0 && < 3"
        mtl: ">= 2.3.1 && < 3"
        stm: ">= 2.5.1.0 && < 3"

executables:
  rzk:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - rzk
    when:
      - condition: "!impl(ghcjs)"
        dependencies:
          with-utf8: ">= 1.0.3.0 && < 2"
          optparse-generic: ">= 1.4.7 && < 2"

tests:
  rzk-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    build-tools:
      hspec-discover:hspec-discover: ">= 2.7 && < 3"
    # aeson and yaml come from the top-level dependencies (with bounds); listing
    # them here too would shadow those with an unbounded entry.
    dependencies:
      - filepath >= 1.4 && < 2
      - rzk
      - hspec >= 2.7 && < 3
      - hspec-discover >= 2.7 && < 3
    when:
      # The LSP specs (semantic tokens, hover formatting) inspect lsp-types
      # values; the spec modules themselves are guarded by LSP_ENABLED.
      - condition: flag(lsp) && !impl(ghcjs)
        dependencies:
          lsp-types: ">= 2.1.1.0 && < 3"

  doctests:
    source-dirs: test
    main: doctests.hs
    other-modules: []
    dependencies:
      base: ">= 4.11.0.0 && < 5.0"
      doctest-parallel: ">= 0.3 && < 1"
      rzk:
      Glob: ">= 0.9.3 && < 1"
      QuickCheck: ">= 2.14 && < 3"
      template-haskell: ">= 2.14.0.0 && < 3"
