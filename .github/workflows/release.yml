name: Release
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hackage:
    name: "Upload a new candidate on Hackage"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # The tag of the release, not the default branch the release targets.
          ref: ${{ github.event.release.tag_name }}

      - name: 🧰 Setup Stack
        uses: freckle/stack-action@v5
        with:
          # The action's default is "--fast --pedantic", an unoptimised build.
          stack-build-arguments: --pedantic

      - name: 🔨 Generate package dist tarball
        run: stack sdist --tar-dir packages/

      - name: 🚀 Upload on Hackage
        uses: haskell-actions/hackage-publish@v1
        with:
          hackageToken: ${{ secrets.HACKAGE_AUTH_TOKEN }}
          packagesPath: packages
          publish: false

  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15 rather than macos-latest: see the note in ghc.yml.
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # The tag of the release, not the default branch the release targets.
          ref: ${{ github.event.release.tag_name }}

      - name: 🧰 Setup Stack
        uses: freckle/stack-action@v5
        with:
          # The action's default is "--fast --pedantic", an unoptimised build.
          stack-build-arguments: --pedantic

      - name: Tar and strip the binary
        run: |
          mkdir -p prepared_binaries/
          cd prepared_binaries/
          export PROGRAM=rzk
          cp `stack exec -- which $PROGRAM` .
          tar -cavf program.tar.gz *
        shell: bash

      - name: 🚀 Upload assets
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./prepared_binaries/program.tar.gz
          asset_name: rzk-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}.tar.gz
          asset_content_type: application/tar.gz
