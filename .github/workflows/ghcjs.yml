name: GHCJS (build and deploy Rzk playground)

on:
  # No `paths:` filter on `push`: a `paths` filter is unreliable on tag pushes
  # (GitHub often skips the run), which is why the playground was not published
  # for past releases. Branch/tag pushes that deploy the playground must always
  # run; the Nix cache keeps an unrelated push cheap. The `paths` filter is kept
  # on `pull_request`, where it only saves CI and never gates a deploy.
  push:
    branches: [main, develop]
    tags: [v*]
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/ghcjs.yml
      - rzk/**
      - rzk-js/**
      - rzk-playground/**
      - stack.yaml
      - "**/*.nix"

  workflow_dispatch: # allow triggering this workflow manually

permissions:
  contents: write

# Cancel an in-flight run when a PR gets a new commit; never cancel a push/tag
# run (those deploy the playground).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy-with-ghcjs:
    name: "Build with GHCJS (and deploy Rzk playground)"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: ❄️ Install Nix
        uses: cachix/install-nix-action@v31.9.0
        with:
          extra_nix_config: |
            substituters = https://cache.nixos.org/ https://cache.iog.io https://nix-community.cachix.org https://miso-haskell.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= miso-haskell.cachix.org-1:6N2DooyFlZOHUfJtAx1Q09H0P5XXYzoxxQYiwn6W1e8=
            keep-outputs = true
            accept-flake-config = true

      - name: 👝 Restore Nix store
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: ghcjs-nix-${{ runner.os }}-${{ hashfiles('./flake.nix', './flake.lock', '.github/workflows/ghcjs.yml', './rzk/rzk.cabal') }}
          restore-prefixes-first-match: |
            ghcjs-nix-${{ runner.os }}-${{ hashfiles('./flake.nix', './flake.lock', '.github/workflows/ghcjs.yml', './rzk/rzk.cabal') }}
            ghcjs-nix-${{ runner.os }}-

      - name: 👝 Restore and cache NodeJS deps
        uses: actions/cache@v5
        with:
          key: ghcjs-node-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ghcjs-node-${{ runner.os }}-
          path: |
            ~/.npm

      # Uncomment to debug this job
      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3

      - name: 🔨 Build Playground
        env:
          ASSET_URL: /${{ github.event.repository.name }}/${{ github.ref_name }}/playground
        run: nix run .#release-rzk-playground

      - name: 🔨 Save flake from garbage collection
        run: nix profile add .#save-flake

      - name: '🚀 Publish JS "binaries" (${{ github.ref_name }})'
        if: ${{ github.ref_name != 'main' && github.event_name == 'push' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: rzk-playground-release
          target-folder: ${{ github.ref_name }}/playground
          clean: false
          single-commit: true

      - name: '🚀 Publish JS "binaries" (latest)'
        if: ${{ startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'v') && github.event_name == 'push' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: rzk-playground-release
          target-folder: latest/playground
          clean: false
          single-commit: true

      - name: '🚀 Publish JS "binaries"'
        if: ${{ github.ref_name == 'main' && github.event_name == 'push' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: rzk-playground-release
          target-folder: playground
          clean: false
          single-commit: true

      - if: always()
        name: 👝 Save Nix store
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ghcjs-nix-${{ runner.os }}-${{ hashfiles('./flake.nix', './flake.lock', '.github/workflows/ghcjs.yml', './rzk/rzk.cabal') }}
          gc-max-store-size: 7G
          purge: true
          purge-prefixes: ghcjs-nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
